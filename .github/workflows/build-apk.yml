name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache

      - name: Install Buildozer
        run: pip install --upgrade buildozer "cython<3" virtualenv requests

      - name: Tell the app which GitHub repo it belongs to (update checks / About links)
        run: echo "${{ github.repository }}" > repo.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp bin/*.apk dist/NSE-Option-Chain-Analyzer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Option-Chain-Analyzer-apk
          path: dist/NSE-Option-Chain-Analyzer.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NSE-Option-Chain-Analyzer.apk
